<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Agent Local Test</title>
</head>
<body>
    <h2>Voice Agent Test Client</h2>
    <button id="connectBtn">Connect</button>
    <button id="startBtn" disabled>Start Talking</button>
    <button id="stopBtn" disabled>Stop Talking</button>
    <p>Status: <span id="status">Disconnected</span></p>
    <p>Response: <span id="response">None</span></p>

    <script>
        let ws;
        let mediaRecorder;
        let audioChunks = [];

        const connectBtn = document.getElementById('connectBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusSpan = document.getElementById('status');
        const responseSpan = document.getElementById('response');

        connectBtn.onclick = () => {
            ws = new WebSocket('ws://localhost:8000/ws/voice');
            
            ws.onopen = () => {
                statusSpan.textContent = 'Connected';
                connectBtn.disabled = true;
                startBtn.disabled = false;
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                responseSpan.textContent = JSON.stringify(data);
            };

            ws.onclose = () => {
                statusSpan.textContent = 'Disconnected';
                connectBtn.disabled = false;
                startBtn.disabled = true;
                stopBtn.disabled = true;
            };
        };

        startBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                    ws.send(event.data);
                }
            };

            mediaRecorder.start(250);
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusSpan.textContent = 'Recording & Streaming...';
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusSpan.textContent = 'Connected (Idle)';
        };
    </script>
</body>
</html>
